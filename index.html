<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div id="flex-container">
    <div class="flex-container card-1">
      <p class="title">Your Result</p>
      <div id="result">
        <p class="result">76</p>
        <p class="total">of 100</p>
      </div>

      <h2>Great</h2>
      <p class="description">You scored higher than 65% of the people who have taken these tests.</p>
    </div>

    <div class="flex-container card-2">
      <p class="title">Summary</p>

      <div class="summary">
        <div class="item reaction">
          <div class="main">
            <h4>Reaction</h4>
          </div>
          <div id="score">
            <p class="score">80</p>
            <p class="out-of">/100</p>
          </div>
        </div>

        <div class="item memory">
          <div class="main">
            <h4>Memory</h4>
          </div>
          <div id="score">
            <p class="score">92</p>
            <p class="out-of">/100</p>
          </div>
        </div>

        <div class="item verbal">
          <div class="main">
            <h4>Verbal</h4>
          </div>
          <div id="score">
            <p class="score">61</p>
            <p class="out-of">/100</p>
          </div>
        </div>

        <div class="item visual">
          <div class="main">
            <h4>Visual</h4>
          </div>
          <div id="score">
            <p class="score">72</p>
            <p class="out-of">/100</p>
          </div>
        </div>

        <div class="cta-btn"><a href="#">Continue</a></div>
      </div>
    </div>
  </div>
  
  <!--<footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>-->
</body>
</html>
